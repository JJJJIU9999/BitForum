services:
  mysql:
    # 3.5 GiB budget; pending real-load verification.
    mem_limit: 512m
    memswap_limit: 512m
    image: mysql:8.0
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bit_forum}
    ports:
      # 宿主机与容器端口一致，均为 3306。
      # 历史上曾映射为 3307，是为了避开 Windows 主机上已有的本机 MySQL；
      # 当前 macOS 开发机 3306 空闲，改回 3306 后 application.yml 默认配置可直接生效，
      # 本机启动后端无需再显式设置 SPRING_DATASOURCE_URL。
      #
      # S3：只绑定回环地址。这些端口原本发布到所有网卡（"3306:3306" 等价于 0.0.0.0），
      # 同一局域网内的其他机器可以直接连到开发库。本项目只做本机开发与答辩演示，
      # 因此统一收敛为 127.0.0.1。（不加 TLS、不引入生产密码体系。）
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # M13 起使用 Redis Stack：在 Redis 7.4 基础上内置 RediSearch 模块，
  # 这是 Spring AI 的 RedisVectorStore 做向量检索的前置条件。
  # 原来的 redis:7-alpine 没有该模块，向量索引无法创建。
  # 注意：镜像变了，6379 端口和协议不变，现有 RedisService 的 String/Set/ZSet 用法零改动。
  redis:
    # 3.5 GiB budget; pending real-load verification.
    mem_limit: 384m
    memswap_limit: 384m
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    environment:
      # 镜像自带的 /entrypoint.sh 负责 --loadmodule 加载 RediSearch 等模块，
      # 这里只通过 REDIS_ARGS 追加参数，千万不要用 command 覆盖 entrypoint，
      # 否则模块不会加载，FT.CREATE 等向量检索命令会报 unknown command。
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction"
    ports:
      # S3：同样只绑定回环地址
      - "127.0.0.1:6379:6379"
    volumes:
      # 用独立的卷名，避免与旧的 redis:7-alpine 数据文件冲突
      - redis-stack-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    # 3.5 GiB budget; pending real-load verification.
    mem_limit: 320m
    memswap_limit: 320m
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +A 4 -rabbit vm_memory_high_watermark {absolute,201326592}"
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD}
    ports:
      # S3：5672（AMQP）与 15672（管理台）同样只绑定回环地址
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  
  app:
    # 3.5 GiB budget; pending real-load verification.
    mem_limit: 1280m
    memswap_limit: 1280m
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=2 -Dsun.net.http.retryPost=false"
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      # app 和 mysql 在同一个 Compose 网络里，所以后端容器用服务名 mysql + 容器端口 3306 访问数据库
      # allowPublicKeyRetrieval=true 用来解决 MySQL 8 在容器环境下可能出现的 Public Key Retrieval is not allowed
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bit_forum}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      # 收费能力默认关闭；非空占位值见.env.example，真实密钥仅本机注入。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_ENABLED: ${DEEPSEEK_CHAT_ENABLED:-false}
      BITFORUM_QA_TOOLS_ENABLED: ${BITFORUM_QA_TOOLS_ENABLED:-false}
      BITFORUM_QA_ALLOW_WRITE_TOOLS: ${BITFORUM_QA_ALLOW_WRITE_TOOLS:-false}
      BITFORUM_RECOMMEND_REASON_ENABLED: ${BITFORUM_RECOMMEND_REASON_ENABLED:-false}
      BITFORUM_MODERATION_MODEL_ENABLED: ${BITFORUM_MODERATION_MODEL_ENABLED:-false}
      BITFORUM_MODERATION_AUTO_APPROVE: ${BITFORUM_MODERATION_AUTO_APPROVE:-false}
      BITFORUM_ANALYST_MODEL_ENABLED: ${BITFORUM_ANALYST_MODEL_ENABLED:-false}
    volumes:
      - uploads-data:/app/uploads

  frontend:
    # 3.5 GiB budget; pending real-load verification.
    mem_limit: 64m
    memswap_limit: 64m
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 4 http://127.0.0.1/api/category/list | grep -Eq '\"code\"[[:space:]]*:[[:space:]]*200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  redis-stack-data:
  uploads-data:
