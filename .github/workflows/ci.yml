name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify complete test inventory
        run: python3 scripts/test_inventory.py
      - name: Run no-infrastructure tests
        run: ./mvnw -B -s maven-settings.xml -Dbitforum.test.reports=target/finalization/unit test
      - name: Summarize unit coverage
        if: always()
        run: python3 scripts/summarize-tests.py unit target/finalization/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: |
            target/finalization/unit/summary.json
            target/finalization/unit/sanitized/*.xml

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: bitforum-ci-disposable-db
          MYSQL_DATABASE: bitforum_finalization_test
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pbitforum-ci-disposable-db --silent"
          --health-interval=3s --health-timeout=3s --health-retries=30
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 26379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s --health-timeout=3s --health-retries=30
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: finalization_test
          RABBITMQ_DEFAULT_PASS: bitforum-ci-disposable-mq
        ports:
          - 25672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=3s --health-timeout=5s --health-retries=30
    env:
      CI_DB_PASSWORD: bitforum-ci-disposable-db
      CI_MQ_PASSWORD: bitforum-ci-disposable-mq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # M15 起测试上下文会加载本地 ONNX 嵌入模型与 tokenizer（TransformersEmbeddingModel
      # 在类路径存在时无条件构建，无法用开关关闭，见 findings.md 6.8.1）。
      # 不缓存时每次 CI 都要从 HuggingFace 下载上百 MB，网络抖动会直接让上下文启动失败
      # （实测出现过 `Failed to cache the resource ... SocketException: Connection reset`）。
      - name: Cache ONNX embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bitforum-onnx
          # 模型标识与 application.yml 的 transformers 配置保持一致；换模型时改这里的 key
          key: bitforum-onnx-bge-base-zh-v1.5-quantized-v1
          restore-keys: |
            bitforum-onnx-bge-base-zh-v1.5-
      - name: Pre-download ONNX model with retry
        # 缓存未命中时先带重试地下载（比在 Spring 上下文启动阶段失败更可控、日志更清晰）；
        # 已命中缓存时这一步几乎瞬间完成（文件已存在则不重复下载）。
        run: |
          CACHE_DIR="$HOME/.cache/bitforum-onnx"
          mkdir -p "$CACHE_DIR"
          BASE="https://huggingface.co/Xenova/bge-base-zh-v1.5/resolve/main"
          for pair in "model_quantized.onnx:onnx/model_quantized.onnx" "tokenizer.json:tokenizer.json"; do
            FILE="${pair%%:*}"; REMOTE="${pair##*:}"
            if [ -s "$CACHE_DIR/$FILE" ]; then
              echo "已存在，跳过下载：$FILE"
              continue
            fi
            echo "下载 $REMOTE ..."
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$CACHE_DIR/$FILE" "$BASE/$REMOTE"
          done
          ls -la "$CACHE_DIR"
      - name: Run complete isolated service sets
        env:
          CI_MYSQL_ID: ${{ job.services.mysql.id }}
          CI_REDIS_ID: ${{ job.services.redis.id }}
          CI_RABBITMQ_ID: ${{ job.services.rabbitmq.id }}
        run: python3 scripts/run-isolated-tests.py --ci --sets integration,cm22,cm23,cm24,external-ai
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: |
            target/finalization/**/summary/*.json
            target/finalization/**/sanitized/*.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
